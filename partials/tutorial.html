<div id="tutorialLayer" class="tutorial-layer hidden" aria-hidden="true">
  <div id="tutorialBlocker" class="tutorial-blocker"></div>
  <div id="tutorialSpotlight" class="tutorial-spotlight hidden" aria-hidden="true"></div>
  <section id="tutorialCard" class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
    <div class="tutorial-progress-row">
      <span id="tutorialStepLabel" class="tutorial-step-label"></span>
      <button id="btnTutorialSkip" type="button" class="tutorial-skip">スキップ</button>
    </div>
    <h2 id="tutorialTitle" class="tutorial-title"></h2>
    <div id="tutorialText" class="tutorial-text"></div>
    <div class="tutorial-actions">
      <button id="btnTutorialBack" type="button" class="tutorial-secondary">戻る</button>
      <button id="btnTutorialNext" type="button" class="tutorial-primary">次へ</button>
    </div>
  </section>
</div>
