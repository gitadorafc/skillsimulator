<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GITADORA Skill Simulator</title>
<meta name="app-version" content="4.34.0">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=21_7">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png?v=21_7">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=21_7">
<link rel="shortcut icon" href="./favicon.ico?v=21_7">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=21_7">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png?v=21_7">
<link rel="mask-icon" href="./favicon.svg?v=21_7" color="#16dfff">
<link rel="manifest" href="./manifest.webmanifest?v=21_7">

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GITADORA Skill Simulator">
<meta name="application-name" content="GITADORA Skill Simulator">

<script>
  // 保存済みテーマを初回描画より前に適用し、更新時のテーマちらつきを防ぐ。
  (() => {
    try {
      if (localStorage.getItem('gitadora_light_mode') !== '1') return;
      document.documentElement.classList.add('light-mode');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f8fafc');
    } catch (_) {}
  })();

  // iPhone / iPadのWebKitで最下部のオーバースクロールを抑止するため識別する。
  (() => {
    const ua = navigator.userAgent || '';
    const isIOSWebKit = /iP(?:hone|ad|od)/.test(ua) && /AppleWebKit/.test(ua);
    document.documentElement.classList.toggle('ios-webkit', isIOSWebKit);
  })();
</script>

<link rel="stylesheet" href="./css/app.css?v=4_17_0">
<link rel="stylesheet" href="./css/app-overrides.css?v=4_34_0">
  <link rel="stylesheet" href="./css/layout-canonical.css?v=4_17_0">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
<script>
  document.body.classList.toggle('light-mode', document.documentElement.classList.contains('light-mode'));
</script>
<div id="appRoot"></div>
<script type="module" src="./js/bootstrap.js?v=4_34_0"></script>
</body>
</html>
